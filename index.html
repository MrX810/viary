<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video-Tagebuch</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #0b0b0e; color: #fff; height: 100vh; overflow: hidden; touch-action: manipulation; }
        #app { display: flex; flex-direction: column; height: 100%; max-width: 500px; margin: 0 auto; width: 100%; background: #121217; position: relative; }

        /* ===== HEADER ===== */
        .header { padding: 12px 16px 8px; display: flex; justify-content: space-between; align-items: center; background: #121217; border-bottom: 1px solid #2a2a35; flex-shrink: 0; z-index: 20; }
        .header h1 { font-size: 20px; font-weight: 600; background: linear-gradient(135deg, #f5b041, #f1c40f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions button { background: #2a2a35; border: none; color: #aaa; padding: 6px 12px; border-radius: 20px; font-size: 12px; margin-left: 6px; cursor: pointer; }
        .header-actions button:active { background: #3d3d4a; }

        /* ===== VIEWS ===== */
        .view { flex: 1; overflow-y: auto; display: none; flex-direction: column; -webkit-overflow-scrolling: touch; position: relative; }
        .view.active { display: flex; }

        /* ===== KAMERA ===== */
        #camera-view { padding: 0; background: #000; justify-content: center; align-items: center; position: relative; }
        .camera-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a22; color: #555; gap: 16px; }
        .camera-placeholder span { font-size: 60px; opacity: 0.3; }
        .camera-placeholder p { font-size: 16px; }
        .video-preview { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: none; }
        .video-preview.active { display: block; }
        
        /* Kamera Overlay Buttons (Dreh-Button) */
        .cam-overlay-btn {
            position: absolute; top: 20px; right: 20px; z-index: 15;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            width: 48px; height: 48px; color: #fff; font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.15s;
        }
        .cam-overlay-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
        .cam-overlay-btn.hidden { display: none; }

        .camera-controls {
            position: absolute; bottom: 40px; left: 0; right: 0;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            padding: 0 20px; z-index: 10; pointer-events: none;
        }
        .camera-controls > * { pointer-events: auto; }
        .record-btn {
            width: 80px; height: 80px; border-radius: 50%; background: #e74c3c; border: 4px solid #fff;
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.6); transition: all 0.15s; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: white;
        }
        .record-btn:active { transform: scale(0.92); }
        .record-btn.recording { background: #2ecc71; box-shadow: 0 0 30px rgba(46, 204, 113, 0.6); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .mood-selector { display: flex; gap: 30px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 10px 20px; border-radius: 50px; border: 1px solid #333; }
        .mood-btn { font-size: 32px; background: none; border: none; cursor: pointer; filter: grayscale(1); opacity: 0.5; transition: all 0.1s; }
        .mood-btn.selected { filter: grayscale(0); opacity: 1; transform: scale(1.2); }
        .mood-btn:active { transform: scale(1.5); }
        .timer-badge { background: rgba(0,0,0,0.6); padding: 4px 14px; border-radius: 20px; font-size: 14px; font-variant-numeric: tabular-nums; color: #fff; border: 1px solid #444; }

        /* ===== GALERIE ===== */
        #gallery-view { padding: 12px 16px 100px; background: #121217; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .gallery-item { position: relative; aspect-ratio: 9 / 16; background: #1e1e26; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #2a2a35; }
        .gallery-item video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .gallery-item .mood-emoji { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.7); border-radius: 30px; padding: 2px 8px; font-size: 14px; backdrop-filter: blur(4px); }
        .gallery-item .recap-badge { position: absolute; top: 4px; left: 4px; background: rgba(241, 196, 15, 0.9); border-radius: 30px; padding: 2px 8px; font-size: 10px; font-weight: bold; color: #000; backdrop-filter: blur(4px); }
        .gallery-item .delete-btn { position: absolute; top: 4px; right: 4px; background: rgba(255,0,0,0.8); border: none; color: #fff; border-radius: 30px; width: 24px; height: 24px; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px); z-index: 5; }
        .gallery-item .rel-date { position: absolute; bottom: 30px; left: 4px; background: rgba(0,0,0,0.6); border-radius: 30px; padding: 2px 8px; font-size: 10px; color: #ccc; backdrop-filter: blur(4px); }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #555; font-size: 16px; }

        /* ===== KALENDER ===== */
        #calendar-view { padding: 12px 16px 100px; background: #121217; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; }
        .cal-header h2 { font-size: 20px; font-weight: 600; }
        .cal-header button { background: none; border: none; color: #f1c40f; font-size: 24px; cursor: pointer; padding: 0 12px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .cal-grid .weekday { font-size: 12px; color: #666; padding: 6px 0; }
        .cal-grid .day {
            aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 16px; cursor: pointer; position: relative; transition: all 0.1s;
            color: #aaa; background: transparent; border: 2px solid transparent;
        }
        .cal-grid .day.today { border-color: #e74c3c; color: #fff; font-weight: bold; }
        .cal-grid .day.has-video { color: #fff; }
        .cal-grid .day .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 2px; }
        .cal-grid .day .dot.happy { background: #2ecc71; }
        .cal-grid .day .dot.neutral { background: #f1c40f; }
        .cal-grid .day .dot.sad { background: #3498db; }
        .cal-grid .day .dot.mixed { background: #9b59b6; }
        .cal-grid .day:active { transform: scale(0.9); }
        .cal-day-list { margin-top: 20px; border-top: 1px solid #2a2a35; padding-top: 16px; display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .cal-day-list .list-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #1e1e26; border-radius: 12px; cursor: pointer; }
        .cal-day-list .list-item video { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .cal-day-list .list-item .info { flex: 1; font-size: 14px; }
        .cal-day-list .list-item .info small { color: #666; font-size: 12px; }
        .cal-empty { color: #555; text-align: center; padding: 20px 0; font-size: 14px; }

        /* ===== MODAL PLAYER ===== */
        #playerModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; display: none; align-items: center; justify-content: center; flex-direction: column; backdrop-filter: blur(10px); }
        #playerModal.active { display: flex; }
        #playerModal video { width: 100%; max-height: 90%; background: #000; object-fit: contain; }
        .modal-close { position: absolute; top: 40px; right: 20px; font-size: 36px; color: #fff; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #444; z-index: 10; }
        .modal-close:active { background: rgba(255,255,255,0.3); }

        /* ===== UNDO BANNER ===== */
        #undoBanner { position: fixed; bottom: 80px; left: 20px; right: 20px; background: #2a2a35; padding: 12px 16px; border-radius: 16px; display: none; justify-content: space-between; align-items: center; z-index: 100; backdrop-filter: blur(10px); border: 1px solid #444; }
        #undoBanner.active { display: flex; }
        #undoBanner .undo-btn { color: #f1c40f; font-weight: bold; background: none; border: none; font-size: 16px; cursor: pointer; }

        /* ===== EXPORT PROGRESS ===== */
        #exportOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; backdrop-filter: blur(5px); }
        #exportOverlay.active { display: flex; }
        #exportOverlay .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #f1c40f; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #exportOverlay p { color: #fff; font-size: 16px; }

        /* ===== DATUMSAUSWAHL (BOTTOM SHEET) ===== */
        #datePicker { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a22; border-top: 1px solid #2a2a35; padding: 20px 16px 30px; z-index: 50; transform: translateY(100%); transition: transform 0.3s ease; border-radius: 20px 20px 0 0; max-height: 70vh; overflow-y: auto; }
        #datePicker.active { transform: translateY(0); }
        #datePicker h3 { font-size: 18px; margin-bottom: 12px; color: #fff; }
        #datePicker .date-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        #datePicker .date-list .day-btn { padding: 8px 16px; border-radius: 30px; border: 2px solid #333; background: transparent; color: #aaa; font-size: 14px; cursor: pointer; transition: all 0.1s; }
        #datePicker .date-list .day-btn.selected { border-color: #f1c40f; background: rgba(241, 196, 15, 0.2); color: #fff; }
        #datePicker .date-list .day-btn:active { transform: scale(0.95); }
        #datePicker .recap-toggle { display: flex; align-items: center; gap: 12px; margin: 12px 0; padding: 8px 0; border-top: 1px solid #2a2a35; border-bottom: 1px solid #2a2a35; }
        #datePicker .recap-toggle label { color: #aaa; font-size: 14px; }
        #datePicker .recap-toggle input[type="checkbox"] { width: 20px; height: 20px; accent-color: #f1c40f; }
        #datePicker .actions { display: flex; gap: 12px; margin-top: 16px; }
        #datePicker .actions button { flex: 1; padding: 12px; border-radius: 30px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
        #datePicker .actions .save-btn { background: #f1c40f; color: #000; }
        #datePicker .actions .cancel-btn { background: #2a2a35; color: #aaa; }
        #datePicker .actions button:active { transform: scale(0.96); }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav { display: flex; background: #1a1a22; border-top: 1px solid #2a2a35; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); z-index: 30; position: relative; }
        .bottom-nav button { flex: 1; padding: 10px 0 8px; background: none; border: none; color: #777; font-size: 11px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; transition: color 0.1s; border-top: 3px solid transparent; }
        .bottom-nav button .icon { font-size: 22px; line-height: 1; }
        .bottom-nav button.active { color: #f1c40f; border-top-color: #f1c40f; background: rgba(241, 196, 15, 0.05); }
        .bottom-nav button:active { background: #2a2a35; }
        ::-webkit-scrollbar { display: none; }

        /* ===== PIN OVERLAY ===== */
        #pinOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; backdrop-filter: blur(20px); }
        #pinOverlay.active { display: flex; }
        #pinOverlay .pin-title { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #fff; }
        #pinOverlay .pin-sub { color: #888; font-size: 14px; margin-bottom: 30px; }
        #pinOverlay .pin-dots { display: flex; gap: 16px; margin-bottom: 30px; }
        #pinOverlay .pin-dots span { width: 16px; height: 16px; border-radius: 50%; background: #333; transition: background 0.1s; }
        #pinOverlay .pin-dots span.filled { background: #f1c40f; }
        #pinOverlay .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 280px; width: 100%; }
        #pinOverlay .pin-pad button { padding: 18px; font-size: 24px; border-radius: 50%; border: none; background: #2a2a35; color: #fff; cursor: pointer; aspect-ratio: 1/1; }
        #pinOverlay .pin-pad button:active { background: #3d3d4a; }
        #pinOverlay .pin-pad .empty-btn { background: transparent; pointer-events: none; }
        #pinOverlay .pin-pad .del-btn { background: transparent; font-size: 20px; color: #888; }
        #pinOverlay .pin-error { color: #e74c3c; font-size: 14px; margin-top: 16px; min-height: 24px; }
        #pinOverlay .skip-btn { margin-top: 20px; background: none; border: none; color: #666; font-size: 14px; text-decoration: underline; cursor: pointer; }
        #pinOverlay .skip-btn:active { color: #aaa; }
    </style>
</head>
<body>

<!-- ===== PIN OVERLAY ===== -->
<div id="pinOverlay">
    <div class="pin-title">🔒 Tagebuch</div>
    <div class="pin-sub">PIN eingeben</div>
    <div class="pin-dots" id="pinDots">
        <span></span><span></span><span></span><span></span>
    </div>
    <div class="pin-pad" id="pinPad">
        <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
        <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
        <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
        <button class="empty-btn"></button><button data-num="0">0</button><button class="del-btn" id="pinDel">⌫</button>
    </div>
    <div class="pin-error" id="pinError"></div>
    <button class="skip-btn" id="pinSkip">PIN überspringen</button>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none;">
    <!-- HEADER -->
    <div class="header">
        <h1>📖 Tagebuch</h1>
        <div class="header-actions">
            <button id="exportBtn">📦 Export</button>
            <button id="importBtn">📂 Import</button>
            <input type="file" id="fileInput" accept=".zip" style="display:none">
        </div>
    </div>

    <!-- KAMERA -->
    <div id="camera-view" class="view active">
        <div class="camera-placeholder" id="cameraPlaceholder">
            <span>📷</span>
            <p>Drücke den roten Knopf<br>zum Aufnehmen</p>
        </div>
        <video id="videoPreview" class="video-preview" autoplay playsinline muted></video>
        <button class="cam-overlay-btn hidden" id="flipBtn">↺</button>
        <div class="camera-controls">
            <div class="timer-badge" id="timerDisplay">00:00</div>
            <button class="record-btn" id="recordBtn">●</button>
            <div class="mood-selector">
                <button class="mood-btn selected" data-mood="happy">😊</button>
                <button class="mood-btn" data-mood="neutral">😐</button>
                <button class="mood-btn" data-mood="sad">😔</button>
            </div>
        </div>
    </div>

    <!-- GALERIE -->
    <div id="gallery-view" class="view">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- KALENDER -->
    <div id="calendar-view" class="view">
        <div class="cal-header">
            <button id="calPrev">‹</button>
            <h2 id="calMonthYear">August 2026</h2>
            <button id="calNext">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-day-list" id="calDayList">
            <div class="cal-empty">Tippe auf einen Tag</div>
        </div>
    </div>

    <!-- NAV -->
    <div class="bottom-nav">
        <button id="navCamera" class="active"><span class="icon">📷</span> Kamera</button>
        <button id="navGallery"><span class="icon">🖼️</span> Galerie</button>
        <button id="navCalendar"><span class="icon">📅</span> Kalender</button>
    </div>
</div>

<!-- PLAYER MODAL -->
<div id="playerModal"><div class="modal-close" id="modalClose">✕</div><video id="modalVideo" controls playsinline autoplay></video></div>

<!-- UNDO BANNER -->
<div id="undoBanner"><span id="undoText">Video gelöscht</span><button class="undo-btn" id="undoBtn">Rückgängig</button></div>

<!-- EXPORT OVERLAY -->
<div id="exportOverlay"><div class="spinner"></div><p id="exportStatus">Packe Videos...</p></div>

<!-- DATUMSAUSWAHL (BOTTOM SHEET) -->
<div id="datePicker">
    <h3>📅 Für welchen Tag?</h3>
    <div class="date-list" id="dateList"></div>
    <div class="recap-toggle">
        <input type="checkbox" id="recapToggle">
        <label for="recapToggle">📌 Recap-Modus (mehrere Tage, max. 7)</label>
    </div>
    <div class="actions">
        <button class="cancel-btn" id="dateCancel">Abbrechen</button>
        <button class="save-btn" id="dateSave">Speichern</button>
    </div>
</div>

<script>
    (async function() {
        "use strict";

        // ========== DOM REFS ==========
        const app = document.getElementById('app');
        const pinOverlay = document.getElementById('pinOverlay');
        const pinDots = document.querySelectorAll('#pinDots span');
        const pinPad = document.getElementById('pinPad');
        const pinDel = document.getElementById('pinDel');
        const pinError = document.getElementById('pinError');
        const pinSkip = document.getElementById('pinSkip');

        const videoPreview = document.getElementById('videoPreview');
        const placeholder = document.getElementById('cameraPlaceholder');
        const recordBtn = document.getElementById('recordBtn');
        const flipBtn = document.getElementById('flipBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const galleryGrid = document.getElementById('galleryGrid');
        const calGrid = document.getElementById('calGrid');
        const calMonthYear = document.getElementById('calMonthYear');
        const calPrev = document.getElementById('calPrev');
        const calNext = document.getElementById('calNext');
        const calDayList = document.getElementById('calDayList');
        const navCamera = document.getElementById('navCamera');
        const navGallery = document.getElementById('navGallery');
        const navCalendar = document.getElementById('navCalendar');
        const cameraView = document.getElementById('camera-view');
        const galleryView = document.getElementById('gallery-view');
        const calendarView = document.getElementById('calendar-view');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const fileInput = document.getElementById('fileInput');
        const modal = document.getElementById('playerModal');
        const modalVideo = document.getElementById('modalVideo');
        const modalClose = document.getElementById('modalClose');
        const undoBanner = document.getElementById('undoBanner');
        const undoText = document.getElementById('undoText');
        const undoBtn = document.getElementById('undoBtn');
        const exportOverlay = document.getElementById('exportOverlay');
        const exportStatus = document.getElementById('exportStatus');
        const datePicker = document.getElementById('datePicker');
        const dateList = document.getElementById('dateList');
        const recapToggle = document.getElementById('recapToggle');
        const dateCancel = document.getElementById('dateCancel');
        const dateSave = document.getElementById('dateSave');

        // ========== PIN LOGIC ==========
        let pinCode = '';
        let storedPin = localStorage.getItem('videoJournalPin') || '';
        let pinAttempt = '';
        let pinTimeout = null;

        function showPin() {
            app.style.display = 'none';
            pinOverlay.classList.add('active');
            pinAttempt = '';
            updatePinDots();
            pinError.textContent = '';
        }

        function hidePin() {
            pinOverlay.classList.remove('active');
            app.style.display = 'flex';
            if (pinTimeout) clearTimeout(pinTimeout);
            pinTimeout = setTimeout(() => { if (!pinOverlay.classList.contains('active')) showPin(); }, 60000); // 1 Min
        }

        function updatePinDots() {
            pinDots.forEach((dot, i) => dot.classList.toggle('filled', i < pinAttempt.length));
        }

        // PIN Pad
        pinPad.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            if (btn === pinDel) {
                pinAttempt = pinAttempt.slice(0, -1);
                updatePinDots();
                pinError.textContent = '';
                return;
            }
            const num = btn.dataset.num;
            if (num === undefined) return;
            if (pinAttempt.length >= 4) return;
            pinAttempt += num;
            updatePinDots();

            if (pinAttempt.length === 4) {
                if (storedPin === '') {
                    // PIN setzen
                    storedPin = pinAttempt;
                    localStorage.setItem('videoJournalPin', storedPin);
                    pinError.textContent = '✅ PIN gesetzt!';
                    setTimeout(hidePin, 400);
                } else if (pinAttempt === storedPin) {
                    pinError.textContent = '✅ Richtig!';
                    setTimeout(hidePin, 300);
                } else {
                    pinError.textContent = '❌ Falscher PIN';
                    pinAttempt = '';
                    updatePinDots();
                }
            }
        });

        pinSkip.addEventListener('click', () => {
            if (storedPin === '') {
                hidePin();
            } else {
                pinError.textContent = 'PIN benötigt';
            }
        });

        // ========== OPFS ==========
        let rootDir, videoDir;
        async function initOPFS() {
            try {
                rootDir = await navigator.storage.getDirectory();
                videoDir = await rootDir.getDirectoryHandle('videos', { create: true });
            } catch (e) { alert('OPFS nicht unterstützt.'); throw e; }
        }
        await initOPFS();

        // ========== METADATEN ==========
        async function loadMetadata() {
            try {
                const fh = await rootDir.getFileHandle('metadata.json', { create: true });
                const file = await fh.getFile();
                if (file.size === 0) return [];
                return JSON.parse(await file.text());
            } catch { return []; }
        }
        async function saveMetadata(meta) {
            const fh = await rootDir.getFileHandle('metadata.json', { create: true });
            const w = await fh.createWritable();
            await w.write(JSON.stringify(meta, null, 2));
            await w.close();
        }

        // ========== HELPERS ==========
        function getDateStr(d) {
            return d.toISOString().slice(0,10);
        }
        function getTodayStr() { return getDateStr(new Date()); }
        function getRelativeDate(dateStr) {
            const today = getTodayStr();
            if (dateStr === today) return 'Heute';
            const d = new Date(dateStr + 'T00:00:00');
            const diff = Math.floor((Date.now() - d.getTime()) / 86400000);
            if (diff === 1) return 'Gestern';
            if (diff <= 7) return `Vor ${diff} Tagen`;
            if (diff <= 14) return 'Letzte Woche';
            return d.toLocaleDateString('de-DE');
        }

        // ========== VIDEO SPEICHERN ==========
        async function saveVideoToOPFS(blob, mood, dates) {
            const id = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            const filename = id + '.mp4';
            const fh = await videoDir.getFileHandle(filename, { create: true });
            const w = await fh.createWritable();
            await w.write(blob);
            await w.close();
            const meta = await loadMetadata();
            meta.push({ id, filename, timestamp: Date.now(), mood, dates });
            await saveMetadata(meta);
            return id;
        }

        async function deleteVideoById(id) {
            let meta = await loadMetadata();
            const entry = meta.find(m => m.id === id);
            if (!entry) return false;
            try { await videoDir.removeEntry(entry.filename); } catch(e) {}
            meta = meta.filter(m => m.id !== id);
            await saveMetadata(meta);
            return true;
        }

        // ========== KAMERA STATE ==========
        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let timerInterval = null;
        let seconds = 0;
        let selectedMood = 'happy';
        let useFrontCam = true;
        let isFlipping = false;
        let pendingVideoData = null; // für DatePicker

        // ========== KAMERA FUNKTIONEN ==========
        async function startCamera(facingMode = 'user') {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 720 } },
                    audio: true
                });
                videoPreview.srcObject = stream;
                videoPreview.classList.add('active');
                placeholder.style.display = 'none';
                flipBtn.classList.remove('hidden');
                recordBtn.classList.remove('hidden');
                return true;
            } catch(e) {
                alert('Kamera/Mikrofon Zugriff verweigert.');
                return false;
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
                videoPreview.srcObject = null;
                videoPreview.classList.remove('active');
                placeholder.style.display = 'flex';
                flipBtn.classList.add('hidden');
            }
        }

        // ========== FLIP (während Aufnahme) ==========
        async function flipCamera() {
            if (isFlipping || !stream) return;
            isFlipping = true;
            // Kurzer Fade-to-Black (0.3s)
            videoPreview.style.transition = 'opacity 0.3s';
            videoPreview.style.opacity = '0';

            setTimeout(async () => {
                useFrontCam = !useFrontCam;
                const facing = useFrontCam ? 'user' : 'environment';
                // Pause recorder
                if (mediaRecorder && isRecording) {
                    mediaRecorder.pause();
                }
                // Kamera wechseln
                const newStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facing, width: { ideal: 720 } },
                    audio: true
                });
                // Alten Stream ersetzen
                if (stream) stream.getTracks().forEach(t => t.stop());
                stream = newStream;
                videoPreview.srcObject = stream;
                // Aufnahme fortsetzen
                if (mediaRecorder && isRecording) {
                    mediaRecorder.resume();
                }
                // Einblenden
                videoPreview.style.opacity = '1';
                isFlipping = false;
            }, 300);
        }

        // ========== AUFNAHME ==========
        async function startRecording() {
            if (isRecording) return;
            const camOk = await startCamera(useFrontCam ? 'user' : 'environment');
            if (!camOk) return;

            recordedChunks = [];
            seconds = 0;
            timerDisplay.textContent = '00:00';
            const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm;codecs=vp9,opus';
            mediaRecorder = new MediaRecorder(stream, { mimeType });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = async () => {
                if (recordedChunks.length > 0) {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                    pendingVideoData = { blob, mood: selectedMood };
                    showDatePicker(); // Datumsauswahl öffnen
                }
                clearInterval(timerInterval);
                timerDisplay.textContent = '00:00';
                recordBtn.textContent = '●';
                recordBtn.classList.remove('recording');
                isRecording = false;
                recordedChunks = [];
                // Kamera läuft weiter
            };
            mediaRecorder.start(1000);
            isRecording = true;
            recordBtn.textContent = '⏹';
            recordBtn.classList.add('recording');
            timerInterval = setInterval(() => {
                seconds++;
                const m = String(Math.floor(seconds/60)).padStart(2,'0');
                const s = String(seconds%60).padStart(2,'0');
                timerDisplay.textContent = `${m}:${s}`;
            }, 1000);
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                clearInterval(timerInterval);
            }
        }

        // ========== DATUMSAUSWAHL (BOTTOM SHEET) ==========
        let selectedDates = [];
        let recapMode = false;

        function showDatePicker() {
            const today = new Date();
            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                days.push(d);
            }
            dateList.innerHTML = '';
            selectedDates = [getDateStr(today)]; // default heute
            recapToggle.checked = false;
            recapMode = false;

            days.forEach(d => {
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                const ds = getDateStr(d);
                const label = ds === getTodayStr() ? 'Heute' : d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric' });
                btn.textContent = label;
                btn.dataset.date = ds;
                if (ds === getTodayStr()) btn.classList.add('selected');
                btn.addEventListener('click', () => toggleDateSelection(ds, btn));
                dateList.appendChild(btn);
            });

            datePicker.classList.add('active');
        }

        function toggleDateSelection(ds, btn) {
            if (!recapMode) {
                // Einzelmodus
                document.querySelectorAll('#dateList .day-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedDates = [ds];
                return;
            }
            // Recap-Modus: max 7, müssen zusammenhängen
            const allBtns = [...document.querySelectorAll('#dateList .day-btn')];
            const allDates = allBtns.map(b => b.dataset.date);
            const idx = allDates.indexOf(ds);
            if (idx === -1) return;

            // Prüfen ob Auswahl lückenlos ist
            const currentlySelected = allBtns.filter(b => b.classList.contains('selected')).map(b => b.dataset.date);
            let newSelection;
            if (currentlySelected.includes(ds)) {
                // Entfernen
                newSelection = currentlySelected.filter(d => d !== ds);
            } else {
                // Hinzufügen
                newSelection = [...currentlySelected, ds];
            }
            // Sortieren
            newSelection.sort();
            // Prüfen ob zusammenhängend
            let valid = true;
            for (let i = 1; i < newSelection.length; i++) {
                const a = new Date(newSelection[i-1] + 'T00:00:00');
                const b = new Date(newSelection[i] + 'T00:00:00');
                const diff = (b - a) / 86400000;
                if (diff !== 1) { valid = false; break; }
            }
            if (!valid && newSelection.length > 0) {
                // Ungültig: nimm nur den ersten
                newSelection = [newSelection[0]];
            }
            if (newSelection.length > 7) newSelection = newSelection.slice(0,7);
            selectedDates = newSelection;
            allBtns.forEach(b => b.classList.toggle('selected', selectedDates.includes(b.dataset.date)));
        }

        recapToggle.addEventListener('change', () => {
            recapMode = recapToggle.checked;
            if (recapMode) {
                // Alle bisherigen löschen, nur heutigen Tag auswählen
                document.querySelectorAll('#dateList .day-btn').forEach(b => b.classList.remove('selected'));
                const todayBtn = document.querySelector('#dateList .day-btn[data-date="' + getTodayStr() + '"]');
                if (todayBtn) { todayBtn.classList.add('selected'); selectedDates = [getTodayStr()]; }
            } else {
                document.querySelectorAll('#dateList .day-btn').forEach(b => b.classList.remove('selected'));
                const todayBtn = document.querySelector('#dateList .day-btn[data-date="' + getTodayStr() + '"]');
                if (todayBtn) { todayBtn.classList.add('selected'); selectedDates = [getTodayStr()]; }
            }
        });

        dateCancel.addEventListener('click', () => {
            datePicker.classList.remove('active');
            pendingVideoData = null;
        });

        dateSave.addEventListener('click', async () => {
            if (!pendingVideoData) return;
            const { blob, mood } = pendingVideoData;
            const dates = selectedDates.length > 0 ? selectedDates : [getTodayStr()];
            await saveVideoToOPFS(blob, mood, dates);
            datePicker.classList.remove('active');
            pendingVideoData = null;
            renderGallery();
            renderCalendar();
            switchView('gallery');
        });

        // ========== FLIP BUTTON ==========
        flipBtn.addEventListener('click', flipCamera);

        // ========== RECORD BUTTON ==========
        recordBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        // ========== MOOD ==========
        document.querySelectorAll('.mood-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedMood = btn.dataset.mood;
            });
        });

        // ========== NAVIGATION ==========
        let currentView = 'camera';

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
            if (view === 'camera') {
                cameraView.classList.add('active');
                navCamera.classList.add('active');
                if (stream) {
                    videoPreview.classList.add('active');
                    placeholder.style.display = 'none';
                    flipBtn.classList.remove('hidden');
                } else {
                    videoPreview.classList.remove('active');
                    placeholder.style.display = 'flex';
                    flipBtn.classList.add('hidden');
                }
                if (isRecording) stopRecording();
            } else if (view === 'gallery') {
                galleryView.classList.add('active');
                navGallery.classList.add('active');
                stopCamera();
                renderGallery();
            } else if (view === 'calendar') {
                calendarView.classList.add('active');
                navCalendar.classList.add('active');
                stopCamera();
                renderCalendar();
            }
        }

        navCamera.addEventListener('click', () => switchView('camera'));
        navGallery.addEventListener('click', () => switchView('gallery'));
        navCalendar.addEventListener('click', () => switchView('calendar'));

        // ========== GALERIE RENDER ==========
        let galleryInterval = null;

        async function renderGallery() {
            if (galleryInterval) clearInterval(galleryInterval);
            const meta = await loadMetadata();
            galleryGrid.innerHTML = '';
            if (meta.length === 0) {
                galleryGrid.innerHTML = '<div class="empty-state">Noch keine Einträge.<br>🎥 Nimm dein erstes Video auf!</div>';
                return;
            }
            meta.sort((a,b) => b.timestamp - a.timestamp);
            for (let item of meta) {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                try {
                    const fh = await videoDir.getFileHandle(item.filename);
                    const file = await fh.getFile();
                    const url = URL.createObjectURL(file);
                    const video = document.createElement('video');
                    video.src = url;
                    video.preload = 'metadata';
                    video.muted = true;
                    video.playsInline = true;
                    video.loop = true;
                    div.appendChild(video);

                    // Auto-Play beim Scrollen (Intersection Observer)
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                video.play().catch(()=>{});
                            } else {
                                video.pause();
                            }
                        });
                    }, { threshold: 0.3 });
                    observer.observe(video);

                    div.addEventListener('click', () => {
                        // Popup mit original FileHandle
                        fh.getFile().then(f => {
                            const u = URL.createObjectURL(f);
                            modalVideo.src = u;
                            modal.classList.add('active');
                            modalVideo.play();
                        });
                    });

                    // Mood Emoji
                    const moodSpan = document.createElement('span');
                    moodSpan.className = 'mood-emoji';
                    const moodMap = { happy:'😊', neutral:'😐', sad:'😔' };
                    moodSpan.textContent = moodMap[item.mood] || '😐';
                    div.appendChild(moodSpan);

                    // Recap Badge
                    if (item.dates && item.dates.length > 1) {
                        const badge = document.createElement('span');
                        badge.className = 'recap-badge';
                        badge.textContent = `📅 +${item.dates.length-1}`;
                        div.appendChild(badge);
                    }

                    // Relative Date
                    const relDate = document.createElement('span');
                    relDate.className = 'rel-date';
                    const firstDate = item.dates ? item.dates[0] : getDateStr(new Date(item.timestamp));
                    relDate.textContent = getRelativeDate(firstDate);
                    div.appendChild(relDate);

                    // Delete Button
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        // Sanftes Löschen mit Undo
                        const deletedId = item.id;
                        div.style.transition = 'opacity 0.3s, transform 0.3s';
                        div.style.opacity = '0';
                        div.style.transform = 'scale(0.8)';
                        setTimeout(() => {
                            div.style.display = 'none';
                        }, 300);

                        // Undo Banner
                        undoText.textContent = 'Video gelöscht';
                        undoBanner.classList.add('active');
                        let undone = false;
                        const undoHandler = () => {
                            undone = true;
                            undoBanner.classList.remove('active');
                            renderGallery();
                        };
                        undoBtn.onclick = undoHandler;
                        setTimeout(() => {
                            if (!undone) {
                                undoBanner.classList.remove('active');
                                deleteVideoById(deletedId).then(() => {
                                    renderGallery();
                                    renderCalendar();
                                });
                            }
                        }, 5000);
                    });
                    div.appendChild(delBtn);

                } catch(e) {
                    div.innerHTML = `<div style="padding:20px;color:#888;">⚠️ Fehler</div>`;
                }
                galleryGrid.appendChild(div);
            }
        }

        // ========== KALENDER RENDER ==========
        let calDate = new Date();

        async function renderCalendar() {
            const meta = await loadMetadata();
            const year = calDate.getFullYear();
            const month = calDate.getMonth();
            calMonthYear.textContent = new Date(year, month).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
            const daysInMonth = new Date(year, month+1, 0).getDate();
            const today = getTodayStr();

            let html = '';
            const weekdays = ['So','Mo','Di','Mi','Do','Fr','Sa'];
            weekdays.forEach(w => html += `<div class="weekday">${w}</div>`);

            for (let i = 0; i < firstDay; i++) {
                html += `<div class="day"></div>`;
            }

            // Tages-Metadaten sammeln
            const dayMap = {};
            meta.forEach(item => {
                const dates = item.dates || [getDateStr(new Date(item.timestamp))];
                dates.forEach(d => {
                    if (!dayMap[d]) dayMap[d] = [];
                    dayMap[d].push(item);
                });
            });

            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                const dateStr = getDateStr(dateObj);
                const isToday = dateStr === today;
                const hasVideos = dayMap[dateStr] && dayMap[dateStr].length > 0;

                let moodDot = '';
                if (hasVideos) {
                    const moods = dayMap[dateStr].map(i => i.mood);
                    const unique = [...new Set(moods)];
                    if (unique.length > 1) moodDot = 'mixed';
                    else moodDot = unique[0];
                }

                html += `<div class="day ${isToday?'today':''} ${hasVideos?'has-video':''}" data-date="${dateStr}">
                            ${d}
                            ${hasVideos ? `<div class="dot ${moodDot}"></div>` : ''}
                        </div>`;
            }

            calGrid.innerHTML = html;

            // Klick auf Tag
            document.querySelectorAll('.cal-grid .day').forEach(el => {
                if (!el.dataset.date) return;
                el.addEventListener('click', () => {
                    const ds = el.dataset.date;
                    renderDayList(ds);
                });
            });

            // Standardmäßig heutigen Tag anzeigen
            const todayEl = document.querySelector('.cal-grid .day.today');
            if (todayEl) renderDayList(todayEl.dataset.date);
            else renderDayList(getTodayStr());
        }

        async function renderDayList(dateStr) {
            const meta = await loadMetadata();
            const items = meta.filter(item => {
                const dates = item.dates || [getDateStr(new Date(item.timestamp))];
                return dates.includes(dateStr);
            });
            calDayList.innerHTML = '';
            if (items.length === 0) {
                calDayList.innerHTML = `<div class="cal-empty">📷 Keine Einträge für diesen Tag</div>`;
                return;
            }
            for (let item of items) {
                const div = document.createElement('div');
                div.className = 'list-item';
                try {
                    const fh = await videoDir.getFileHandle(item.filename);
                    const file = await fh.getFile();
                    const url = URL.createObjectURL(file);
                    const vid = document.createElement('video');
                    vid.src = url;
                    vid.muted = true;
                    vid.playsInline = true;
                    vid.preload = 'metadata';
                    vid.style.width = '60px';
                    vid.style.height = '60px';
                    vid.style.objectFit = 'cover';
                    vid.style.borderRadius = '8px';
                    div.appendChild(vid);

                    const info = document.createElement('div');
                    info.className = 'info';
                    const moodMap = { happy:'😊', neutral:'😐', sad:'😔' };
                    info.innerHTML = `${moodMap[item.mood] || '😐'} <small>${item.dates ? item.dates.join(', ') : getDateStr(new Date(item.timestamp))}</small>`;
                    div.appendChild(info);

                    div.addEventListener('click', () => {
                        fh.getFile().then(f => {
                            const u = URL.createObjectURL(f);
                            modalVideo.src = u;
                            modal.classList.add('active');
                            modalVideo.play();
                        });
                    });
                } catch(e) {
                    div.innerHTML = `<span style="color:#888;">⚠️ Fehler</span>`;
                }
                calDayList.appendChild(div);
            }
        }

        calPrev.addEventListener('click', () => {
            calDate.setMonth(calDate.getMonth() - 1);
            renderCalendar();
        });
        calNext.addEventListener('click', () => {
            calDate.setMonth(calDate.getMonth() + 1);
            renderCalendar();
        });

        // ========== EXPORT ==========
        exportBtn.addEventListener('click', async () => {
            const meta = await loadMetadata();
            if (meta.length === 0) { alert('Keine Einträge.'); return; }
            exportOverlay.classList.add('active');
            const zip = new JSZip();
            const videoFolder = zip.folder('videos');
            zip.file('metadata.json', JSON.stringify(meta, null, 2));
            let count = 0;
            for (let item of meta) {
                count++;
                exportStatus.textContent = `Packe Video ${count} von ${meta.length}...`;
                try {
                    const fh = await videoDir.getFileHandle(item.filename);
                    const file = await fh.getFile();
                    videoFolder.file(item.filename, await file.arrayBuffer());
                } catch(e) {}
            }
            exportStatus.textContent = 'Erstelle ZIP...';
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(zipBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Tagebuch_Backup_${getTodayStr()}.zip`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            exportOverlay.classList.remove('active');
        });

        // ========== IMPORT ==========
        importBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const zip = await JSZip.loadAsync(file);
                const metaFile = zip.file('metadata.json');
                if (!metaFile) { alert('Ungültiges Backup.'); return; }
                const importedMeta = JSON.parse(await metaFile.async('string'));
                const videoFiles = zip.folder('videos');
                for (let item of importedMeta) {
                    const fd = videoFiles.file(item.filename);
                    if (fd) {
                        const blob = await fd.async('blob');
                        const fh = await videoDir.getFileHandle(item.filename, { create: true });
                        const w = await fh.createWritable();
                        await w.write(blob);
                        await w.close();
                    }
                }
                let existing = await loadMetadata();
                const newIds = new Set(importedMeta.map(m => m.id));
                existing = existing.filter(m => !newIds.has(m.id));
                await saveMetadata([...existing, ...importedMeta]);
                alert(`✅ ${importedMeta.length} Einträge importiert!`);
                renderGallery();
                renderCalendar();
            } catch(err) { alert('Import fehlgeschlagen: ' + err.message); }
            fileInput.value = '';
        });

        // ========== MODAL PLAYER ==========
        modalClose.addEventListener('click', () => {
            modal.classList.remove('active');
            modalVideo.pause();
            modalVideo.src = '';
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
                modalVideo.pause();
                modalVideo.src = '';
            }
        });

        // ========== INIT ==========
        // PIN prüfen
        if (storedPin) {
            showPin();
        } else {
            // kein PIN gesetzt: optional setzen
            showPin(); // zeigt immer, aber mit Skip
        }

        // Nach PIN-Erfolg starten
        // Wird in hidePin() getriggert
        const origHide = hidePin;
        hidePin = function() {
            origHide();
            if (app.style.display === 'flex') {
                // App initialisieren
                renderGallery();
                renderCalendar();
                // Kamera nicht starten (nur auf Knopf)
                recordBtn.classList.remove('hidden');
                flipBtn.classList.add('hidden');
            }
        };
        // Überschreibe für den Fall dass PIN schon gesetzt
        // Trick: Nach dem ersten Laden
        setTimeout(() => {
            if (app.style.display === 'flex') {
                renderGallery();
                renderCalendar();
            }
        }, 100);

        console.log('📖 Video-Tagebuch geladen. Alle Features aktiv!');
    })();
</script>
</body>
</html>
